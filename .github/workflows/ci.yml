name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static
            command: bun run devcheck --no-fix --fast
          - name: Bun
            command: bun run test:coverage
          - name: Real Node
            command: bun run rebuild && bun run test:node
          - name: Worker
            command: bun run test:worker
          - name: Integration
            command: bun run rebuild && bun run test:integration
          - name: Package
            command: bun run test:package
          - name: Async leaks
            command: bun run test:leaks
          - name: Deterministic order
            command: bun run test:order
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }} checks
        run: ${{ matrix.command }}
