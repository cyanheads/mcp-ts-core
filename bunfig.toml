# Bunfig: Centralized configuration for Bun behavior
# For more options, see: https://bun.com/docs/runtime/bunfig

[install]
# Block package versions published less than a day ago — supply-chain guard
# against freshly compromised releases, which are usually pulled within hours.
# Matches `templates/_bunfig.toml`, so every version this repo installs is one
# a consumer can install the day it ships. Bun widens the window automatically
# when it detects rapid-fire publishes just past the gate. Existing versions in
# bun.lock are unaffected.
minimumReleaseAge = 86400 # seconds (1 day)

[install.security]
# Socket scans every package before install (malware, typosquats, CVEs).
# Note: configuring a scanner disables Bun's auto-install.
scanner = "@socketsecurity/bun-security-scanner"

[run]
# When true, scripts running 'node' (e.g., from a dependency) will transparently use 'bun' instead.
# Set to false if you need to enforce a strict Node.js runtime for a specific script.
bun = true
