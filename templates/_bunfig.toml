# Bunfig: Centralized configuration for Bun behavior
# For more options, see: https://bun.com/docs/runtime/bunfig

[install]
# Block package versions published less than a day ago — supply-chain guard
# against freshly compromised releases, which are usually pulled within hours.
# Existing versions in bun.lock are unaffected.
minimumReleaseAge = 86400 # seconds (1 day)
# Framework releases are first-party — adopt them same-day.
minimumReleaseAgeExcludes = ["@cyanheads/mcp-ts-core"]

[install.security]
# Socket scans every package before install (malware, typosquats, CVEs).
# Note: configuring a scanner disables Bun's auto-install.
scanner = "@socketsecurity/bun-security-scanner"
